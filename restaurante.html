<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurante & Bar · Hotel Onix</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="editorial.css"><link rel="stylesheet" href="portal.css"><style>
#rb-root{margin-top:10px}
.rb-idioma-nota{font-size:12px;color:var(--gold);opacity:.85;margin:0 0 14px}
.rb-tabs{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 18px}
.rb-tab{background:var(--panel);border:1px solid #d5b57855;border-radius:30px;color:var(--ink);

.rb-tab.is-active{background:var(--gold);color:#172021;border-color:var(--gold)}
.rb-panel{display:none}
.rb-panel.is-active{display:block}
.rb-titulo{color:var(--gold);margin:6px 0 4px}
.rb-cat{font-family:Georgia,serif;font-size:22px;color:var(--gold);border-bottom:1px solid #d5b57855;

.rb-regcab{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#b9a06f;margin:14px 0 4px}

.rb-item-main{min-width:0}
.rb-name{font-size:16px;color:var(--ink)}
.rb-reg{font-size:11px;color:#b9a06f;margin-left:8px;text-transform:uppercase;letter-spacing:.5px}
.rb-en{font-size:13px;color:#b9a06f;font-style:italic}
.rb-desc{font-size:13px;color:#aab0a8}
.rb-price{font-family:Georgia,serif;color:var(--gold);white-space:nowrap;text-align:right}
.rb-meia{color:#b9a06f;font-size:12px}
.rb-als{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rb-al{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;

.rb-dia{background:var(--panel);border:1px solid #d5b57830;border-radius:10px;padding:20px}

.rb-dia-item{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid #ffffff10}
.rb-dia-rot{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:1px;min-width:80px;padding-top:2px}
.rb-rodape{font-size:12px;color:#aab0a8;margin-top:12px}
.rb-vazio,.rb-load{color:#aab0a8;padding:20px 0}
@media print{.rb-tabs{display:none}.rb-panel{display:block!important}.rb-cat{color:#172021}
